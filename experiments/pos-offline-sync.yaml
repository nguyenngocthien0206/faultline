name: pos-offline-sync
description: >
  A store's POS goes offline for two days. When it reconnects, its orders reach
  the source with their real (older) timestamps, behind the extractor's cursor.
dataset:
  profile: tiny
faults:
  - type: pos_offline_sync
    offline_from: 2    # the till is offline on days 2 and 3
    sync_on: 4         # and syncs on day 4, old timestamps intact
properties: [no_data_loss, no_silent_corruption]
