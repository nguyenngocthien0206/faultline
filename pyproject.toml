[project]
name = "faultline"
version = "0.1.0"
description = "Chaos and invariant testing for data platforms."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Nguyen Ngoc Thien" }]
requires-python = ">=3.11"
keywords = ["data-engineering", "chaos-engineering", "testing", "idempotency", "duckdb"]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Topic :: Database",
    "Topic :: Software Development :: Testing",
]
dependencies = [
    "duckdb>=1.5.6,<2",
    "faker>=40.52.0",
    "typer>=0.29.0",
]

[project.urls]
Repository = "https://github.com/nguyenngocthien0206/faultline"

[project.scripts]
faultline = "faultline.cli:app"

[project.optional-dependencies]
reference = [
    "psycopg[binary]>=3.3.8",
]

[dependency-groups]
dev = [
    "psycopg[binary]>=3.3.8",
    "pytest>=9.2.0",
    "pytest-xdist>=3.8.0",
    "ruff>=0.17.4",
]

[build-system]
requires = ["uv_build>=0.11.14,<0.12"]
build-backend = "uv_build"

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "UP",   # pyupgrade
    "B",    # flake8-bugbear
    "SIM",  # flake8-simplify
    "PT",   # flake8-pytest-style
    "RUF",  # ruff-specific rules
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["-ra", "--strict-markers", "--strict-config"]
markers = [
    "integration: runs the reference platform in subprocesses (slower)",
    "hardened: exercises the hardened edition of the reference platform",
]
